<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datalayer Comparator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Datalayer Comparator</h1>

  <div class="inputs">

    <div class="panel">
      <label>Tag esperado</label>
      <textarea id="esperado" placeholder="Pegá el tag esperado acá"></textarea>
    </div>

    <div class="panel">
      <label>Tag recibido</label>
      <textarea id="recibido" placeholder="Pegá el datalayer recibido acá"></textarea>
    </div>

  </div>

  <button id="btn-comparar">Comparar</button>

  <div id="resultado"></div>

  <script src="app.js"></script>
</body>
</html>
